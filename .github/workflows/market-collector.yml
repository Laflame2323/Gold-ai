name: Gold AI market data collector

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/market-collector.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-ai-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Collect and archive all gold timeframes
        env:
          GOLD_AI_API_URL: https://gold-ai-backend-p9el.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          url = os.environ["GOLD_AI_API_URL"].rstrip("/") + "/analyse"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "GoldAI-GitHubCollector/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=150) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  print("Backend HTTP:", response.status)
          except Exception as exc:
              print("Collector request failed:", repr(exc))
              sys.exit(1)

          required = {"M1", "M5", "M15", "M30", "H1", "H4"}
          archives = payload.get("archive_status") or {}
          saved = sorted(
              tf for tf, result in archives.items()
              if result.get("status") == "saved"
          )
          failed = {
              tf: result.get("status", "missing")
              for tf, result in archives.items()
              if result.get("status") != "saved"
          }
          missing = sorted(required - set(archives))
          history = payload.get("history_archive") or {}
          history_failed = {
              name: result.get("status", "missing")
              for name, result in history.items()
              if result.get("status") != "saved"
          }
          for name in ("daily", "intraday"):
              if name not in history:
                  history_failed[name] = "missing"
          print(json.dumps({
              "symbol": payload.get("symbol", "XAUUSD"),
              "saved_timeframes": saved,
              "failed_timeframes": failed,
              "missing_timeframes": missing,
              "history_archive": history,
              "history_failures": history_failed,
              "ai_trained": payload.get("ai_trained", False),
              "research_only": payload.get("research_only", True),
          }, indent=2))
          if failed or missing or history_failed:
              sys.exit(1)
          PY

      - name: Verify MT5 ingestion rejects unauthenticated requests
        env:
          GOLD_AI_API_URL: https://gold-ai-backend-p9el.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          url = os.environ["GOLD_AI_API_URL"].rstrip("/") + "/broker/mt5/candles"
          body = {
              "broker_server": "security-probe",
              "symbol": "XAUUSD",
              "timeframe": "M1",
              "candles": [{
                  "time": 1609459200,
                  "open": 1900.0,
                  "high": 1901.0,
                  "low": 1899.0,
                  "close": 1900.5
              }]
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
          except urllib.error.HTTPError as exc:
              status = exc.code

          print("Unauthenticated MT5 ingestion response:", status)
          if status not in (401, 503):
              print("SECURITY CHECK FAILED: unauthenticated MT5 request was not rejected.")
              sys.exit(1)
          print("SECURITY CHECK PASSED: MT5 ingestion remains locked without a valid token.")
          PY
