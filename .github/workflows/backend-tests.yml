name: Backend tests

on:
  push:
    branches: [main, research/net-expectancy-engine, research/day-trader-workflow-adaptation]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Run nested pytest research tests
        working-directory: backend
        run: python -m pytest -v tests/test_d1_buy_candidate.py tests/test_point_in_time_features.py tests/test_profitability_research.py tests/test_m30_sweep_reclaim_research.py tests/test_market_data_quality.py
