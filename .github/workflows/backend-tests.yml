name: Backend tests

on:
  push:
    branches: [main, research/net-expectancy-engine, research/day-trader-workflow-adaptation]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend unit tests
        working-directory: backend
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Confirm nested research tests are discoverable
        working-directory: backend
        run: python -m unittest -v tests.test_d1_buy_candidate tests.test_point_in_time_features tests.test_profitability_research
