name: Gold AI daily macro context archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/macro-context.yml"
      - "backend/macro_data.py"
      - "backend/main.py"
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-ai-macro-context
  cancel-in-progress: false

jobs:
  archive-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch and archive FRED macro context
        env:
          GOLD_AI_API_URL: https://gold-ai-backend-p9el.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          url = os.environ["GOLD_AI_API_URL"].rstrip("/") + "/research/macro"
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "GoldAI-FRED-Archive/1.0"},
          )
          try:
              with urllib.request.urlopen(request, timeout=100) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  print("Backend HTTP:", response.status)
          except urllib.error.HTTPError as exc:
              print("Macro archive HTTP error:", exc.code, exc.read(1500).decode("utf-8", errors="replace"))
              sys.exit(1)
          except Exception as exc:
              print("Macro archive request failed:", repr(exc))
              sys.exit(1)

          series = payload.get("series") or {}
          archive = payload.get("archive") or {}
          summary = {
              "source": payload.get("source"),
              "series_available": sorted(series),
              "series_errors": payload.get("errors") or {},
              "latest_observation_dates": {
                  key: value.get("observation_date") for key, value in series.items()
              },
              "archive_status": archive.get("status"),
              "rows_sent": archive.get("rows_sent", 0),
          }
          print(json.dumps(summary, indent=2))
          if len(series) < 3 or archive.get("status") != "saved" or not summary["rows_sent"]:
              sys.exit(1)
          PY
