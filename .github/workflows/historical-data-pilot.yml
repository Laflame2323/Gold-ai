name: Historical XAUUSD dataset acquisition pilot

on:
  workflow_dispatch:
  push:
    branches:
      - research/multitimeframe-feature-builder
    paths:
      - .github/workflows/historical-data-pilot.yml

permissions:
  contents: read

jobs:
  acquire-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download independent historical sample
        run: |
          set -euo pipefail
          mkdir -p data/histdata_pilot
          for year in 2009 2010 2025; do
            file="DAT_MT_XAUUSD_M1_${year}.csv"
            url="https://huggingface.co/datasets/fokan/xauusd-2009-2026/resolve/main/${file}?download=true"
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 600 "${url}" -o "data/histdata_pilot/${file}"
            test -s "data/histdata_pilot/${file}"
          done
      - name: Inspect raw formats and audit rows
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          report = {"source": "Hugging Face fokan/xauusd-2009-2026; files identify HistData XAUUSD M1", "research_only": True, "exness_data_used": False, "files": []}
          for path in sorted(Path("data/histdata_pilot").glob("*.csv")):
              counts, samples = {}, []
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              with path.open("r", encoding="utf-8-sig", errors="replace", newline="") as f:
                  for i, row in enumerate(csv.reader(f)):
                      counts[len(row)] = counts.get(len(row), 0) + 1
                      if len(samples) < 5: samples.append(row)
              report["files"].append({"file": path.name, "bytes": path.stat().st_size, "sha256": digest, "row_width_counts": counts, "first_rows": samples})
          Path("data/histdata_pilot/audit.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-histdata-acquisition-pilot
          path: data/histdata_pilot/
          retention-days: 14
