name: Research model tests

on:
  push:
    branches:
      - research/multitimeframe-feature-builder
  pull_request:
    branches:
      - research/multitimeframe-feature-builder

concurrency:
  group: gold-ai-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-gradient-boosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run gradient boosting research tests
        working-directory: backend
        run: python -m unittest -v test_gradient_boosting_research
      - name: Run profit-aware meta-model tests
        working-directory: backend
        run: python -m unittest -v test_profit_aware_research
      - name: Test Dukascopy bid ask M1 loader
        working-directory: backend
        run: python -m unittest -v test_getdata_research_evaluation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download independent Dukascopy XAUUSD M1 bid and ask history
        run: |
          mkdir -p data/dukascopy
          npx --yes dukascopy-node -i xauusd -from 2025-01-01 -to 2026-11-19 -t m1 -p bid -f csv -v -bs 50 -bp 250 -r 3 -dir data/dukascopy -fn XAUUSD_bid
          npx --yes dukascopy-node -i xauusd -from 2025-01-01 -to 2026-11-19 -t m1 -p ask -f csv -v -bs 50 -bp 250 -r 3 -dir data/dukascopy -fn XAUUSD_ask
      - name: Evaluate chronological M30 and H1 candidates with observed spread
        run: |
          python backend/getdata_research_evaluation.py \
            --input data/dukascopy/XAUUSD_bid.csv \
            --ask-input data/dukascopy/XAUUSD_ask.csv \
            --output data/dukascopy/research_evaluation.json
      - name: Preserve independent bid-ask research report
        uses: actions/upload-artifact@v4
        with:
          name: gold-ai-dukascopy-bid-ask-research-evaluation
          path: data/dukascopy/
          retention-days: 14
