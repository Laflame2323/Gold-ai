name: Security baseline tests

on:
  push:
    branches:
      - research/multitimeframe-feature-builder
  pull_request:
    branches:
      - research/multitimeframe-feature-builder

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security middleware tests
        run: python -m unittest discover -s backend -p "test_security_controls.py" -v
